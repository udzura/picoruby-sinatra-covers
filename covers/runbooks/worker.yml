desc: Cover Sinatra behavior on PicoRuby Cloudflare Workers
vars:
  scenario: basic
  port: 8787
steps:
  - exec:
      command: WORKER_PORT="{{ vars.port }}" ruby covers/backends/worker/start.rb
      background: true
      env:
        COVER_SCENARIO: "{{ vars.scenario }}"
  - include:
      path: verify.yml
      vars:
        base_url: "http://127.0.0.1:{{ vars.port }}"
        scenario: "{{ vars.scenario }}"
